<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contador de Água</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
--bg:#eef7ff;--card:#fff;--text:#12324a;--muted:#6b8499;--accent:#1e90ff;--accent2:#8fd0ff;--lock:#dbe7f0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1722;--card:#13273a;--text:#e6f2ff;--muted:#8aa6bd;--accent:#4aa8ff;--accent2:#1c4a70;--lock:#1b3248}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1722;--card:#13273a;--text:#e6f2ff;--muted:#8aa6bd;--accent:#4aa8ff;--accent2:#1c4a70;--lock:#1b3248}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 32px;max-width:480px;margin-inline:auto}
h1{font-size:18px;margin:0 0 16px;color:var(--muted);font-weight:600;text-align:center}
.card{background:var(--card);border-radius:24px;padding:20px;margin-bottom:16px}
.count{font-size:84px;font-weight:800;text-align:center;line-height:1;color:var(--accent)}
.sub{text-align:center;color:var(--muted);margin-top:6px}
.bar{height:12px;background:var(--lock);border-radius:99px;margin-top:16px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s}
.msg{text-align:center;margin-top:12px;min-height:22px;font-weight:600}
.stickers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal.show{display:flex}
.pop{background:var(--card);border-radius:28px;padding:28px 24px;text-align:center;width:100%;max-width:320px;animation:pop .45s}
.big{display:block;margin:0 auto;width:auto;height:auto;max-width:100%;max-height:250px;border-radius:24px}
.pt{font-size:22px;font-weight:800;margin-top:12px;color:var(--accent)}
.pc{color:var(--muted);margin:6px 0 18px}
.st{aspect-ratio:1;border-radius:18px;background:var(--lock);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;filter:grayscale(1);opacity:.45}
.st small{font-size:11px;margin-top:4px;color:var(--text);text-align:center;padding:0 4px}
.st.on{filter:none;opacity:1;background:var(--accent2);animation:pop .5s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.week{display:flex;gap:8px;align-items:flex-end;height:90px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.week b{display:block;background:var(--accent);border-radius:6px;margin-bottom:4px;min-height:3px}
h2{font-size:15px;margin:0 0 12px}
.row{display:flex;gap:10px}
button{flex:1;border:0;border-radius:16px;padding:14px;font-size:15px;font-weight:600;background:var(--accent);color:#fff}
button.alt{background:var(--lock);color:var(--text)}

.times{display:flex;flex-wrap:wrap;gap:8px}.times span{background:var(--lock);border-radius:99px;padding:6px 12px;font-size:13px}
.empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<h1>💧 Contador de Água</h1>
<div class="card">
  <div class="count" id="n">0</div>
  <div class="sub">copos hoje · meta: <span id="goal">8</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="msg" id="msg"></div>
</div>
<div class="modal" id="modal"><div class="pop"><img class="big" id="pe" alt=""><div class="pt" id="pt"></div><div class="pc" id="pc"></div><button id="ok">Fechar</button></div></div>
<div class="card"><h2>Hoje</h2><div class="times" id="times"></div></div>
<div class="card"><h2>Últimos 7 dias</h2><div class="week" id="wk"></div></div>
<div class="row">
  <button id="add">+ Beber</button>
  <button class="alt" id="undo">Desfazer</button>
</div>
<button class="alt" id="reset" style="width:100%;margin-top:10px">Zerar hoje</button>

const ORDER=[4,6,8,1,7,2,3,5,0,10,11,9];
const PHR=["Glub glub! Primeiro gole do dia 💧","Sede? Que sede? Ah, essa sede! 🤔","Você está com sede... muita sede... 🌀","Eu vi você bebendo. Bom trabalho. 👀","Chorei de emoção com esse golão 😭","Nadando em hidratação 🏊","Mergulhando de cabeça na meta! 🫧","META BATIDA! Um brinde com água 🥂","Boiando de tão hidratada 🛟","Que golão! Aaaaah! 🌊","A sede passou longe daqui 🏃","Tá tudo pegando fogo, menos você 🔥"];

const $=id=>document.getElementById(id);
const say=t=>{$("msg").textContent=t};
const dk=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>dk(Date.now());

let docs=[], ready, readyP=new Promise(r=>ready=r), col=null, db=null;
const configured=firebaseConfig.apiKey!=="COLE_AQUI";

const todayList=()=>docs.filter(d=>d.dia===today()).sort((a,b)=>a.ts-b.ts);

function render(){
  const l=todayList(), c=l.length;
  $("n").textContent=c; $("goal").textContent=GOAL;
  $("bar").style.width=Math.min(100,c/GOAL*100)+"%";
  $("times").innerHTML=c?l.map(x=>"<span>"+new Date(x.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+"</span>").join(""):'<span class="empty">Nenhum copo ainda</span>';
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const counts=days.map(d=>docs.filter(x=>x.dia===dk(d)).length);
  const max=Math.max(GOAL,...counts);
  $("wk").innerHTML=days.map((d,i)=>`<div><b style="height:${counts[i]/max*60}px"></b>${counts[i]}<br>${"DSTQQSS"[d.getDay()]}</div>`).join("");
}

let closeT;
function popup(c){
  const i=ORDER[(c-1)%ORDER.length];
  $("pe").src=IMGS[i];
  $("pt").textContent=PHR[(c-1)%PHR.length];
  $("pc").textContent=c+(c===1?" copo hoje":" copos hoje")+" · meta "+GOAL;
  const m=$("modal");m.classList.remove("show");void m.offsetWidth;m.classList.add("show");
  clearTimeout(closeT);closeT=setTimeout(()=>m.classList.remove("show"),4000);
}
$("ok").onclick=()=>$("modal").classList.remove("show");
$("modal").onclick=e=>{if(e.target.id==="modal")e.target.classList.remove("show")};

async function drink(fromTag){
  if(!configured){say("Falta colar a configuração do Firebase");return}
  await Promise.race([readyP,new Promise(r=>setTimeout(r,5000))]);
  const l=todayList();
  if(fromTag&&l.length&&Date.now()-l[l.length-1].ts<COOLDOWN){say("Já registrei agora há pouco 😉");return}
  try{
    await addDoc(col,{ts:Date.now(),dia:today()});
    popup(l.length+1);
    say("Boa! Mais um copo 💧");
  }catch(e){say("Não consegui salvar. Confira a internet e as regras do Firebase.")}
}

$("add").onclick=()=>drink(false);
$("undo").onclick=async()=>{
  const l=todayList(); if(!l.length||!configured)return;
  try{await deleteDoc(doc(db,"goles",l[l.length-1].id));say("Último copo removido")}catch(e){say("Não consegui remover")}
};
let rt;
$("reset").onclick=async()=>{
  const r=$("reset");
  if(r.dataset.arm){
    clearTimeout(rt);delete r.dataset.arm;r.textContent="Zerar hoje";
    if(!configured)return;
    try{const b=writeBatch(db);todayList().forEach(x=>b.delete(doc(db,"goles",x.id)));await b.commit();say("Contador zerado")}catch(e){say("Não consegui zerar")}
    return;
  }
  r.dataset.arm=1;r.textContent="Toque de novo para confirmar";
  rt=setTimeout(()=>{delete r.dataset.arm;r.textContent="Zerar hoje"},3000);
};

function checkHash(){
  if(location.hash==="#beber"){
    drink(true);
    try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  }
}

render();
if(!configured){
  say("Falta colar a configuração do Firebase (veja o LEIA-ME.md)");
}else{
  const app=initializeApp(firebaseConfig);
  db=getFirestore(app); col=collection(db,"goles");
  const start=new Date();start.setDate(start.getDate()-6);start.setHours(0,0,0,0);
  onSnapshot(query(col,where("ts",">=",start.getTime())),
    snap=>{docs=snap.docs.map(d=>({id:d.id,...d.data()}));ready();render()},
    ()=>say("Sem conexão com o banco de dados"));
  checkHash();
  window.addEventListener("hashchange",checkHash);
}
</script>
